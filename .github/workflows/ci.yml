name: CI

# Lint, unit tests and build of the host page, then every demo played in
# check mode against a DataLab Web build served from the same origin
# (``npm run showcase:check``).
#
# DataLab Web is checked out from DataLab-Platform/web at, in order: the
# ``web-ref`` input of a manual run, the ``DATALAB_WEB_REF`` repository
# variable, else ``develop``. The weekly run against DataLab Web develop
# reports regressions without blocking anything.

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      web-ref:
        description: DataLab Web branch, tag or commit to check the demos against
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  showcase-check:
    name: Showcase check (DataLab Web ${{ inputs.web-ref || vars.DATALAB_WEB_REF || 'develop' }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: ${{ github.event_name == 'schedule' }}
    env:
      DATALAB_WEB_REF: ${{ inputs.web-ref || vars.DATALAB_WEB_REF || 'develop' }}
      DATALAB_WEB_DIST: .datalab-web/dist
    steps:
      - uses: actions/checkout@v7

      - name: Check out DataLab Web
        uses: actions/checkout@v7
        with:
          repository: DataLab-Platform/web
          ref: ${{ env.DATALAB_WEB_REF }}
          path: .datalab-web

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .datalab-web/package-lock.json

      - name: Build DataLab Web
        working-directory: .datalab-web
        run: |
          npm ci
          npm run build

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Play every demo in check mode
        run: npm run showcase:check

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
